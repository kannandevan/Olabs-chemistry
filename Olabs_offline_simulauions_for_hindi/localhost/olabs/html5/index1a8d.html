<script>
	document.addEventListener("DOMContentLoaded", function() {
		let styleTag = document.createElement('style');
		styleTag.setAttribute('nonce', 'RANDOM_NONCE');
		document.head.appendChild(styleTag);
		let counter = 0;
		let cssText = '';
		document.querySelectorAll('*[style]').forEach(el => {
			let inlineStyle = el.getAttribute('style').trim();
			if (inlineStyle) {
			counter++;
			// Generate a unique class name
			let className = `auto-style-sim-${counter}`;
			// Add the new class to the element
			el.classList.add(className);
			// Remove the inline style
			el.removeAttribute('style');
			// Add the CSS rule manually into a text string
			cssText += `.${className} { ${inlineStyle} }\n`;
			}
		});
		// Write all CSS rules at once into the style tag
		styleTag.innerHTML = cssText;
		console.log(`Moved ${counter} inline styles into <style> tag.`);
	});
</script>

<script>
function simFullScreenOlab(){
		var $ = function(selector,context){return(context||document).querySelector(selector)};
        var iframe = $("iframe"),
            domPrefixes = 'Webkit Moz O ms Khtml'.split(' ');

            var fullscreen = function(elem){
            var prefix;
			
            // Mozilla and webkit intialise fullscreen slightly differently
            for ( var i = -1, len = domPrefixes.length; ++i < len; ) 
			{
              prefix = domPrefixes[i].toLowerCase();
              if ( elem[prefix + 'EnterFullScreen'] ) {
                // Webkit uses EnterFullScreen for video
                return prefix + 'EnterFullScreen';
                break;
              } else if( elem[prefix + 'RequestFullScreen'] ) {
                // Mozilla uses RequestFullScreen for all elements and webkit uses it for non video elements
                return prefix + 'RequestFullScreen';
                break;
              }
            }
            return false;
        }; 
        // Webkit uses "requestFullScreen" for non video elements
        var fullscreenother = fullscreen(document.createElement("iframe"));
        if(!fullscreen) {
            alert("Fullscreen won't work, please make sure you're using a browser that supports it and you have enabled the feature");
            return;
        }
		iframe[fullscreenother]();
		(this,this.document);
	    }

</script>
